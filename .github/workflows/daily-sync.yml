name: Daily Metabase Catalog Sync

on:
  schedule:
    # Runs every day at 04:30 UTC (10:00 AM IST)
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions or frontend sync API

jobs:
  sync-catalog:
    name: Sync Metabase to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Metabase to Supabase Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python backend/scripts/sync_metabase_to_supabase.py

      - name: Commit and push updated catalog files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/sellers.json frontend/src/lib/data/sellers.json
          if git diff --staged --quiet; then
            echo "No new sellers or catalog changes to commit."
          else
            git commit -m "chore(catalog): automated daily catalog sync [skip ci]"
            git push
          fi
